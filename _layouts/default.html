<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'zh-CN' }}">
  {%- include head.html -%}
  <body class="page-{{ page.layout | default: 'default' }}{% if page.sidebar %} has-discover{% endif %}">
    <a class="skip-link" href="#main-content">跳到主要内容</a>

    <div class="ambient-edge ambient-edge-left" aria-hidden="true">
      <span class="ambient-symbol">✦</span>
      <span class="ambient-rule"></span>
      <span class="ambient-copy">LISTEN / SNOW · CS 2024</span>
    </div>
    <div class="ambient-edge ambient-edge-right" aria-hidden="true">
      <span class="ambient-copy">THINK · BUILD · WRITE</span>
      <span class="ambient-rule"></span>
      <span class="ambient-dots"><i></i><i></i><i></i></span>
    </div>

    <div class="site-frame">
      {%- include profile-sidebar.html -%}

      <main class="site-main" id="main-content" tabindex="-1">
        {{ content }}

        <footer class="compact-footer">
          <span>© {{ site.time | date: '%Y' }} {{ site.author }}</span>
          <span>Powered by Jekyll &amp; GitHub Pages</span>
        </footer>
      </main>

      {% if page.sidebar %}
        {%- include discover-sidebar.html -%}
      {% endif %}
    </div>
  </body>
</html>
