<div class="reading-tools" hidden>
  <button class="reading-exit" type="button" data-reading-exit hidden>退出专注</button>
  <details class="reading-settings">
    <summary>阅读设置</summary>
    <div class="reading-settings-panel">
      <p class="reading-settings-title">阅读偏好</p>
      {% include theme-button.html %}
      <label for="reading-size">正文字号</label>
      <select id="reading-size">
        <option value="standard">标准</option>
        <option value="large">较大</option>
        <option value="larger">更大</option>
      </select>
      <label for="reading-width">正文宽度</label>
      <select id="reading-width" aria-describedby="reading-width-hint">
        <option value="compact">紧凑</option>
        <option value="standard">标准</option>
        <option value="wide">宽松</option>
      </select>
      <small id="reading-width-hint">窄屏自动适配可用空间</small>
      <button type="button" data-reading-focus aria-pressed="false">开启专注阅读</button>
      <small>专注时收起侧栏与装饰，保留文章目录。</small>
      <button type="button" class="reading-reset" data-reading-reset>恢复阅读默认值</button>
    </div>
  </details>
</div>
