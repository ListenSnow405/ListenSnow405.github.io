<aside class="discover-sidebar" aria-label="系列导读">
  <section class="sidebar-section">
    <div class="sidebar-heading">{% include nav-icon.html name='series' %}<h2>系列导读</h2></div>
    <div class="discover-series">
      {% for series in site.data.series %}
        {% assign chapters = site.posts | where: 'series', series.id %}
        <a href="{{ '/series/' | relative_url }}#{{ series.id }}"><strong>{{ series.title }}</strong><span>{{ series.description }}</span><small>{{ chapters.size }} 篇文章 <span aria-hidden="true">→</span></small></a>
      {% endfor %}
    </div>
  </section>
  <a class="discover-all" href="{{ '/archives/' | relative_url }}">浏览全部文章 <span aria-hidden="true">→</span></a>
</aside>
