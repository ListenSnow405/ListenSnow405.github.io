<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- seo -%}

  {%- capture cache_version -%}
    {%- if site.github.build_revision -%}
      {{- site.github.build_revision -}}
    {%- else -%}
      {{- site.time | date: '%s' -}}
    {%- endif -%}
  {%- endcapture -%}
  <meta name="color-scheme" content="light dark">
  <script src="{{ '/assets/js/theme.js' | relative_url }}?v={{ cache_version }}"></script>
  {% if page.layout == 'post' %}
    <script src="{{ '/assets/js/reading.js' | relative_url }}?v={{ cache_version }}"></script>
  {% endif %}
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}?v={{ cache_version }}">
  {%- feed_meta -%}
</head>
