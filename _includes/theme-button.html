<button type="button" class="theme-toggle" data-theme-toggle hidden aria-label="当前暗色模式，切换为浅色模式">
  <svg class="theme-toggle-icon" width="22" height="18" viewBox="0 0 24 20" fill="none" aria-hidden="true">
    <rect x="2" y="4" width="20" height="12" rx="6" stroke="currentColor" stroke-width="1.4" />
    <circle class="theme-toggle-knob" cx="16" cy="10" r="2.5" fill="currentColor" />
  </svg>
  <span data-theme-label aria-live="polite">暗色模式</span>
</button>
